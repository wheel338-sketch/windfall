name: macOS preview builds

# Unsigned macOS preview builds and tests on GitHub's hosted macOS runners
# (Apple hardware). No signing identity, notarization or updater key is
# used: bundles are built with --no-sign and without updater artifacts.
# Workflow artifacts only; nothing is published, tagged or released. Linux
# is built and tested locally in Docker (scripts/linux/), not here.

on:
  push:
    branches: [ci/macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_VERSION: 1.99.0

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    env:
      # The plugin runtime builds with one Cargo job by default; runners
      # have nothing else to keep responsive.
      WINDFALL_RUNTIME_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
          rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: System
        run: |
          uname -a; sw_vers; sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu
          node --version; pnpm --version

      - name: Gates (fmt, UI, clippy, fixtures, workspace tests)
        id: gates
        continue-on-error: true
        env:
          # 3-4 vCPU shared runners: two UI test workers, and the synths'
          # CPU-deadline tests recorded rather than gating (see gates.sh).
          VITEST_WORKERS: 2
          XPLAT_CPU_BUDGET: report
        run: bash scripts/xplat/gates.sh target/xplat-logs

      - name: Bundle (unsigned preview)
        id: bundle
        working-directory: apps/desktop
        run: |
          pnpm tauri build --ci --no-sign --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee ../../target/xplat-logs/bundle.log
          exit "${PIPESTATUS[0]}"

      - name: Collect bundles
        id: collect
        run: |
          out="target/xplat-out"
          mkdir -p "$out"
          cp target/release/bundle/dmg/*.dmg "$out/"
          ditto -c -k --keepParent target/release/bundle/macos/Windfall.app "$out/Windfall_$(uname -m).app.zip"
          (cd "$out" && shasum -a 256 * | tee SHA256SUMS)
          ls -la "$out"

      - name: Bundle contents
        run: |
          app=target/release/bundle/macos/Windfall.app
          {
            find "$app" -maxdepth 3 | head -50
            ls -la "$app/Contents/Resources/plugin-runtime"
            cat "$app/Contents/Resources/plugin-runtime/distribution.json"
            file "$app/Contents/MacOS/windfall-desktop" "$app/Contents/Resources/plugin-runtime/"*
            otool -L "$app/Contents/MacOS/windfall-desktop"
            codesign -dv "$app" 2>&1 || true
          } 2>&1 | tee target/xplat-logs/bundle-contents.log

      - name: Launch smoke (from the mounted DMG)
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$apps"
          ditto "$mount/Windfall.app" "$apps/Windfall.app"
          hdiutil detach "$mount"
          xattr -dr com.apple.quarantine "$apps/Windfall.app" || true
          node scripts/xplat/mcp-launch-smoke.mjs "$apps/Windfall.app/Contents/MacOS/windfall-desktop" target/xplat-smoke/report.json --approve osascript

      - name: Upload bundles
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windfall-preview-macos-${{ runner.arch }}
          path: target/xplat-out/
          retention-days: 14
      - name: Upload logs and smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windfall-logs-macos-${{ runner.arch }}
          path: |
            target/xplat-logs/
            target/xplat-smoke/
          retention-days: 14

      - name: Gate result
        if: always()
        run: |
          cat target/xplat-logs/summary.log || true
          test "${{ steps.gates.outcome }}" = success
