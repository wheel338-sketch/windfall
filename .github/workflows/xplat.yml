name: Linux and macOS preview builds

# Unsigned preview builds and tests on GitHub's hosted macOS runners (Apple
# hardware) and on Ubuntu 22.04. No signing identity, notarization or
# updater key is used: bundles are built with --no-sign and without updater
# artifacts. Workflow artifacts only; nothing is published as a release.

on:
  push:
    branches: [ci/linux-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xplat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_VERSION: 1.99.0
  LINUX_DEPS: >-
    libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf xvfb xdotool imagemagick

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            bundles: app,dmg
          - name: Linux (Ubuntu 22.04)
            os: ubuntu-22.04
            platform: linux
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
          rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
        with:
          key: xplat
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: System
        run: |
          uname -a
          if [ "${{ matrix.platform }}" = macos ]; then sw_vers; sysctl -n machdep.cpu.brand_string; fi
          node --version; pnpm --version

      - name: Gates (fmt, UI, clippy, fixtures, workspace tests)
        id: gates
        continue-on-error: true
        run: bash scripts/xplat/gates.sh target/xplat-logs

      - name: Bundle (unsigned preview)
        id: bundle
        working-directory: apps/desktop
        run: |
          pnpm tauri build --ci --no-sign --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee ../../target/xplat-logs/bundle.log
          exit "${PIPESTATUS[0]}"

      - name: Collect bundles
        id: collect
        run: |
          out="target/xplat-out"
          mkdir -p "$out"
          if [ "${{ matrix.platform }}" = macos ]; then
            cp target/release/bundle/dmg/*.dmg "$out/"
            ditto -c -k --keepParent target/release/bundle/macos/Windfall.app "$out/Windfall_$(uname -m).app.zip"
          else
            cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage "$out/"
          fi
          (cd "$out" && shasum -a 256 * | tee SHA256SUMS)
          ls -la "$out"

      - name: Bundle contents
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            app=target/release/bundle/macos/Windfall.app
            find "$app" -maxdepth 3 | head -50
            ls -la "$app/Contents/Resources/plugin-runtime"
            cat "$app/Contents/Resources/plugin-runtime/distribution.json"
            file "$app/Contents/MacOS/windfall-desktop" "$app/Contents/Resources/plugin-runtime/"*
            otool -L "$app/Contents/MacOS/windfall-desktop"
            codesign -dv "$app" 2>&1 || true
          else
            dpkg-deb --info target/release/bundle/deb/*.deb
            dpkg-deb --contents target/release/bundle/deb/*.deb | grep -E 'plugin-runtime|bin/'
          fi 2>&1 | tee target/xplat-logs/bundle-contents.log

      - name: Launch smoke (macOS, from the mounted DMG)
        if: matrix.platform == 'macos'
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$apps"
          ditto "$mount/Windfall.app" "$apps/Windfall.app"
          hdiutil detach "$mount"
          xattr -dr com.apple.quarantine "$apps/Windfall.app" || true
          node scripts/xplat/mcp-launch-smoke.mjs "$apps/Windfall.app/Contents/MacOS/windfall-desktop" target/xplat-smoke/report.json --approve osascript

      - name: Launch smoke (Linux, the extracted AppImage under Xvfb)
        if: matrix.platform == 'linux'
        run: |
          image=$(ls "$PWD"/target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          work=$(mktemp -d)
          (cd "$work" && "$image" --appimage-extract > /dev/null)
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node scripts/xplat/mcp-launch-smoke.mjs "$work/squashfs-root/AppRun" target/xplat-smoke/report.json

      - name: Upload bundles
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windfall-preview-${{ matrix.platform }}-${{ runner.arch }}
          path: target/xplat-out/
          retention-days: 14
      - name: Upload logs and smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windfall-logs-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            target/xplat-logs/
            target/xplat-smoke/
          retention-days: 14

      - name: Gate result
        if: always()
        run: |
          cat target/xplat-logs/summary.log || true
          test "${{ steps.gates.outcome }}" = success
