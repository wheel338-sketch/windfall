[package]
name = "windfall-plugin"
description = "Windfall engine embedded as CLAP and VST3 plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windfall-core.workspace = true
windfall-project.workspace = true
windfall-engine = { workspace = true, features = ["plugin-export"] }
serde.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0. Reuse the raw CLAP ABI already used by host fixtures.
clap-sys = "0.5.0"
# MIT OR Apache-2.0; already locked for Windfall's VST3 host.
vst3 = "=0.3.0"

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0; already locked. Native control-panel embedding only.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
windfall-plugin-host = { path = "../windfall-plugin-host" }
windfall-dsp.workspace = true

[lints]
workspace = true
