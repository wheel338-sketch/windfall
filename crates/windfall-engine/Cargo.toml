[package]
name = "windfall-engine"
description = "Realtime audio engine, offline renderer and soak test for Windfall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Host-clock entry points for the separate CLAP export target. No device is opened.
plugin-export = []
# Public Windows XInput import library; no SDK/content dependency is bundled.
xinput = []
# ASIO needs the Steinberg ASIO SDK at build time, so it is off by default.
asio = ["cpal/asio"]

[dependencies]
serde.workspace = true
windfall-core.workspace = true
windfall-stretch.workspace = true
windfall-dsp.workspace = true
windfall-project.workspace = true
windfall-ipc.workspace = true

# Apache-2.0. `realtime` raises the audio thread's priority through
# audio_thread_priority (MPL-2.0).
cpal = { version = "0.18.2", features = ["realtime"] }
# MIT OR Apache-2.0.
rtrb = "0.4"
# MIT OR Apache-2.0. Reuse the resolved 6.4 family; standard-bin worker FFT.
rustfft = "~6.4.1"
# MIT. Native WinMM/CoreMIDI/ALSA port control, owned by a dedicated worker.
midir = "0.11"

[[bin]]
name = "windfall-soak"
path = "src/bin/windfall-soak.rs"

[lints]
workspace = true
