[package]
name = "windfall-codec"
description = "Audio file decoding, encoding and waveform overviews for Windfall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
windfall-core.workspace = true

# MPL-2.0. Only the containers and codecs Windfall reads are switched on.
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd",
    "id3v1",
    "id3v2",
    "wav",
    "aiff",
    "pcm",
    "flac",
    "mp3",
    "ogg",
    "vorbis",
] }
# MIT OR Apache-2.0.
thiserror = "2"
# BSD-3-Clause. The Ogg Vorbis encoder: libvorbis with the aoTuV and Lancer
# patches and libogg, all BSD-3-Clause, built with `cc` from the C sources
# its two -sys crates carry. Its default feature draws stream serial numbers
# from the system's randomness and is left off: ours are fixed.
vorbis_rs = { version = "0.5.6", default-features = false }
# LGPL-3.0 bindings; vendored LAME 3.100 is LGPL-2.0-or-later.
# MSVC uses cc; Unix uses the bundled configure scripts via autotools.
mp3lame-encoder = "0.2.5"

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0; already locked at 0.62. OS COM/MF bindings, no codec bundled.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation"] }

[lints]
workspace = true

[dev-dependencies]
windfall-core = { workspace = true, features = ["english"] }
