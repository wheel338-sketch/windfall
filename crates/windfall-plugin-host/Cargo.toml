[package]
name = "windfall-plugin-host"
description = "Hosts third-party CLAP and VST3 plugins for Windfall: scanning, instances, realtime processing, state and editors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Compatibility feature retained for callers. VST3 hosting, like scanning,
# is available in the default build on supported platforms.
vst3-hosting = []

[dependencies]
windfall-core.workspace = true
windfall-dsp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# MIT OR Apache-2.0. The CLAP host layer. Pinned: the crates are young and
# the host is written against these exact versions.
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = [
    "clack-host",
    "audio-ports",
    "gui",
    "latency",
    "log",
    "note-ports",
    "params",
    "state",
    "tail",
    "thread-check",
    "timer",
] }
# MIT OR Apache-2.0. The CLAP C types, for the audio buffers the host builds
# itself. The version clack-host uses.
clap-sys = "0.5.0"
# MIT OR Apache-2.0. Bindings generated from the MIT-licensed VST3 SDK.
vst3 = "=0.3.0"
# ISC. Loads VST3 modules. The version clack-host uses for CLAP files.
libloading = "0.8"
# MIT OR Apache-2.0. Lock-free queues between the main and audio threads.
rtrb = "0.4"

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "windfall-plugin-scan"
path = "src/bin/windfall-plugin-scan.rs"

[[bin]]
name = "windfall-plugin-check"
path = "src/bin/windfall-plugin-check.rs"

[lints]
workspace = true

[dev-dependencies]
windfall-core = { workspace = true, features = ["english"] }
