[package]
name = "windfall-desktop"
description = "The Windfall desktop app shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "windfall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
windfall-analysis.workspace = true
windfall-core.workspace = true
windfall-dsp.workspace = true
windfall-project.workspace = true
windfall-archive.workspace = true
windfall-flp.workspace = true
windfall-ipc.workspace = true
windfall-engine.workspace = true
windfall-stretch.workspace = true
windfall-codec.workspace = true
windfall-factory.workspace = true
windfall-midi.workspace = true
windfall-plugin-host.workspace = true
# GPL-3.0-or-later workspace engine export/package library; no external crate.
windfall-plugin = { path = "../../../crates/windfall-plugin" }
serde.workspace = true
serde_json.workspace = true
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Apache-2.0 OR MIT. Native signature-verified updates; operator supplies host/key.
tauri-plugin-updater = "2.13.3"
# MIT OR Apache-2.0. Existing workspace transitive crates, explicit policy use.
semver = "1"
url = "2"
# MIT OR Apache-2.0. Local time for backup file names.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# CC0-1.0 OR MIT-0 OR Apache-2.0. Turns Windows' `\?\` paths into plain ones.
dunce = "1"
# Unlicense OR MIT. Reuses the workspace's existing transitive package for file identity.
same-file = "1.0.6"
# MIT OR Apache-2.0; reuse the exact workspace-locked hashing/OS entropy packages.
sha2 = "=0.10.9"
getrandom = "=0.3.4"
tempfile = "3"
# MIT OR Apache-2.0. Reuse Tauri's locked HTTP client; rustls supplies HTTPS.
# Integrator regenerates Cargo.lock for this direct edge/TLS feature; no provider SDK.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0. Existing locked package; current-process working set only.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# MIT OR Apache-2.0. Existing locked package; native resident-memory query.
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
# MIT OR Apache-2.0; exact package already locked and used by Tauri.
raw-window-handle = "=0.6.2"

[dev-dependencies]
# MIT OR Apache-2.0. Enable the existing Tauri package's mock runtime for signed-update fixtures; no new package/version.
tauri = { version = "2.12.1", features = ["test"] }
# MIT OR Apache-2.0.
tempfile = "3"

[lints]
workspace = true

[features]
# The ordinary Windows desktop must expose the project-owned controller output.
# The native adapter remains target-gated; no vendor SDK or runtime is bundled.
default = ["xinput"]
xinput = ["windfall-engine/xinput"]
