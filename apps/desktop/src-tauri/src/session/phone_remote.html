<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windfall phone remote</title>
<style>
:root{color-scheme:dark;--background:#181a1d;--foreground:#f0f2f4;--muted:#b9c0c8;--primary:#80d9c2}*{box-sizing:border-box}body{margin:0;padding:1rem;background:var(--background);color:var(--foreground);font:16px system-ui;max-width:60rem;margin:auto}h1{font-size:1.4rem}button,input,select{font:inherit;padding:.8rem;border-radius:.4rem}button{cursor:pointer;touch-action:none;border:1px solid var(--muted);background:var(--background);color:var(--foreground)}button:active{background:var(--primary);color:var(--background)}button:disabled{opacity:.5}label{display:flex;gap:.6rem;align-items:center;margin:.6rem 0}input[type=range]{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(6rem,1fr));gap:.7rem}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}.keys button{min-height:5rem}meter{width:100%}#status{color:var(--muted);min-height:2rem}[hidden]{display:none!important}
</style>
<h1>Windfall phone remote</h1><p id="status" role="status">Enter the pairing code shown in desktop settings.</p>
<form id="pair"><label for="code">Pairing code <input id="code" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" required></label><button>Pair</button></form>
<main id="controls" hidden><div class="grid"><button id="play">Play</button><button id="stop">Stop</button><button id="disconnect">Disconnect</button></div>
<p id="transport"></p><label>Master meter <meter id="meter" min="0" max="1" value="0"></meter></label>
<h2>Mixer</h2><div id="mixer" class="grid"></div><h2>Live notes</h2>
<label for="channel">Channel <select id="channel"></select></label><label for="layout">Surface <select id="layout"><option value="keyboard">Keyboard C4–B4</option><option value="pads">Pads C2–D♯3</option></select></label><div id="notes" class="keys"></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id); let token='',socket=null,sequence=0,generation=0,pending=false,signature='';const held=new Map();
function status(text){$('status').textContent=text;}
function send(action){if(!socket||socket.readyState!==1||pending)return false;pending=true;socket.send(JSON.stringify({token,sequence:++sequence,generation,action}));return true;}
// A short FIFO preserves note-on/off order while keeping one request in flight.
const queue=[];function command(action){if(queue.length>=32){status('Remote command queue is full. Reconnect.');socket?.close();return;}queue.push(action);pump();}function pump(){if(queue.length&&!pending&&send(queue[0]))queue.shift();}
$('pair').onsubmit=async event=>{event.preventDefault();try{const response=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});const result=await response.json();if(!response.ok)throw Error(result.error);token=result.token;sequence=0;socket=new WebSocket('ws://'+location.host+'/ws');socket.onopen=()=>{pending=false;$('pair').hidden=true;$('controls').hidden=false;command({name:'feed'});};socket.onclose=()=>{held.clear();queue.length=0;pending=false;$('controls').hidden=true;status('Disconnected. Restart the desktop remote to pair again.');};socket.onerror=()=>status('Remote connection failed.');socket.onmessage=event=>{const state=JSON.parse(event.data);pending=false;if(state.generation!==generation){held.clear();queue.length=0;generation=state.generation;}status(state.error||'Connected');$('transport').textContent=(state.transport.playing?'Playing':'Stopped')+' · tick '+Math.round(state.feed.tick);$('meter').value=Math.max(...state.feed.meters.slice(0,2),0);const next=JSON.stringify([state.tracks.map(t=>[t.id,t.name]),state.channels]);if(next!==signature){signature=next;$('mixer').replaceChildren();for(const track of state.tracks){const label=document.createElement('label');label.textContent=track.name;const fader=document.createElement('input');fader.type='range';fader.min='0';fader.max='2';fader.step='.01';fader.value=track.gain;fader.setAttribute('aria-label',track.name+' volume');fader.onchange=()=>command({name:'fader',track:track.id,value:Number(fader.value)});label.append(fader);$('mixer').append(label);}$('channel').replaceChildren();for(const channel of state.channels){const option=document.createElement('option');option.value=channel.id;option.textContent=channel.name;$('channel').append(option);}}pump();};}catch(error){status(error.message);}};
$('play').onclick=()=>command({name:'play'});$('stop').onclick=()=>command({name:'stop'});$('disconnect').onclick=()=>socket?.close();
function release(pointer){const note=held.get(pointer);if(note){command({name:'noteOff',...note});held.delete(pointer);}}
function releaseAll(){for(const pointer of [...held.keys()])release(pointer);}
function surface(){releaseAll();$('notes').replaceChildren();const pads=$('layout').value==='pads',count=pads?16:12,root=pads?36:60;const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];for(let i=0;i<count;i++){const button=document.createElement('button');button.textContent=pads?'Pad '+(i+1):names[i];button.onpointerdown=event=>{if(!token||!$('channel').value)return;event.preventDefault();button.setPointerCapture(event.pointerId);const note={channel:Number($('channel').value),key:root+i};held.set(event.pointerId,note);command({name:'noteOn',...note,velocity:.8});};button.onpointerup=event=>release(event.pointerId);button.onpointercancel=event=>release(event.pointerId);button.onlostpointercapture=event=>release(event.pointerId);$('notes').append(button);}}
$('layout').onchange=surface;$('channel').onchange=releaseAll;window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});window.addEventListener('pagehide',()=>socket?.close());surface();setInterval(()=>{if(!pending&&!queue.length)send({name:'feed'});},100);
</script></html>
